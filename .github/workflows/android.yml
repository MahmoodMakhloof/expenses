name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee ../build.log
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk mizan-1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mizan-apk
          path: mizan-*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" mizan-1.0.${{ github.run_number }}.apk \
            --title "ميزان 1.0.${{ github.run_number }}" \
            --notes "نسخة أندرويد من ميزان. نزّل ملف الـ APK وثبّته على موبايلك." \
            --target "${{ github.sha }}"
      - name: Publish build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 60000 build.log > build-tail.log || echo "no log" > build-tail.log
          gh release create "build-failed-${{ github.run_number }}" build-tail.log --prerelease --title "Build failed ${{ github.run_number }}" --notes "سجل البناء" --target "${{ github.sha }}"
