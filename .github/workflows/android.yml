name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk mizan-1.0.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mizan-apk
          path: mizan-*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" mizan-1.0.${{ github.run_number }}.apk \
            --title "ميزان 1.0.${{ github.run_number }}" \
            --notes "نسخة أندرويد من ميزان. نزّل ملف الـ APK وثبّته على موبايلك." \
            --target "${{ github.sha }}"
