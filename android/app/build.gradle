plugins { id 'com.android.application' }

def vCode = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'com.mahmood.mizan'
    compileSdk 34
    defaultConfig {
        applicationId 'com.mahmood.mizan'
        minSdk 24
        targetSdk 34
        versionCode vCode
        versionName "1.0.${vCode}"
    }
    signingConfigs {
        release {
            storeFile file('../mizan.keystore')
            storePassword 'mizan-app-2026'
            keyAlias 'mizan'
            keyPassword 'mizan-app-2026'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Copy the web app into the APK's assets before every build.
tasks.register('copyWebApp', Copy) {
    from('../..') { include 'index.html', 'app.js', 'icon.svg', 'fonts/**' }
    into 'src/main/assets'
}
preBuild.dependsOn copyWebApp
