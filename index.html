<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--REPO-ONLY-START-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1A615D">
<meta name="apple-mobile-web-app-capable" content="yes">
<!--REPO-ONLY-END-->
<title>ميزان</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one-column phone app, sticky month header, content cards, fixed bottom tab bar + floating "add expense" button */
:root{
  --bg:#EEF4F1; --surface:#FFFFFF; --surface-2:#F6FAF8; --ink:#14302A; --muted:#5D716C; --line:#D9E5E0;
  --green:#2E8A66; --teal:#1F6F6B; --teal-2:#2B8C87; --teal-soft:#DDEFEC; --on-teal:#F2FBF8;
  --warm:#B9672F; --warm-soft:#F8EADD; --danger:#B4473A; --danger-soft:#F7E2DE; --warn:#A97A12; --warn-soft:#F6EDD3;
  --c1:#1F6F6B; --c2:#56A77F; --c3:#D08A4E; --c4:#7FB8B3; --c5:#A9643B; --c6:#9DBF6A; --c7:#3F8FA6; --c8:#C9A45C;
  --font-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --r:18px; --r-sm:12px;
  --shadow:0 1px 2px rgb(20 48 42 / .06),0 4px 16px rgb(20 48 42 / .05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1917; --surface:#152420; --surface-2:#1A2C27; --ink:#E2EEEA; --muted:#93A8A2; --line:#25392F;
  --green:#55B990; --teal:#2A8580; --teal-2:#4CB3AD; --teal-soft:#173431; --on-teal:#EFFAF7;
  --warm:#E29B63; --warm-soft:#33251A; --danger:#E5806F; --danger-soft:#3A1F1B; --warn:#E0BE5C; --warn-soft:#332A14;
  --c1:#4CB3AD; --c2:#6CC497; --c3:#E5A06A; --c4:#2F7F7A; --c5:#C77E52; --c6:#B2D27F; --c7:#5BA9C0; --c8:#D9B977;
  --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1917; --surface:#152420; --surface-2:#1A2C27; --ink:#E2EEEA; --muted:#93A8A2; --line:#25392F;
  --green:#55B990; --teal:#2A8580; --teal-2:#4CB3AD; --teal-soft:#173431; --on-teal:#EFFAF7;
  --warm:#E29B63; --warm-soft:#33251A; --danger:#E5806F; --danger-soft:#3A1F1B; --warn:#E0BE5C; --warn-soft:#332A14;
  --c1:#4CB3AD; --c2:#6CC497; --c3:#E5A06A; --c4:#2F7F7A; --c5:#C77E52; --c6:#B2D27F; --c7:#5BA9C0; --c8:#D9B977;
  --shadow:0 1px 2px rgb(0 0 0 / .3); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(104px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:0}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;font-weight:600}
:focus-visible{outline:2px solid var(--teal-2);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:14px 10px}
.top h1{font-size:20px;flex:1;min-width:0}
.top h1 small{display:block;font-family:var(--font-body);font-size:12px;font-weight:500;color:var(--muted)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:disabled{opacity:.35;cursor:default}

.screen{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.card h3{font-size:15px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12.5px}

/* sample banner */
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--ink);border-radius:var(--r-sm);padding:10px 12px;font-size:13px}
.banner p{margin:0;flex:1}
.banner button{border:0;background:var(--surface);border-radius:10px;padding:6px 10px;cursor:pointer;font-weight:600;font-size:12.5px;flex:none}

/* hero */
.hero{background:linear-gradient(160deg,var(--teal) 0%,var(--teal-2) 140%);color:var(--on-teal);border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.hero .lbl{font-size:13px;opacity:.85}
.hero .big{font-size:38px;font-weight:600;line-height:1.1}
.hero .big span{font-size:15px;font-weight:400;opacity:.8;margin-inline-start:4px}
.hero .bar{height:8px;border-radius:99px;background:rgb(255 255 255 / .22);overflow:hidden}
.hero .bar i{display:block;height:100%;border-radius:99px;background:var(--on-teal)}
.hero .bar i.over{background:#FFC9B8}
.hero .split{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero .split div{min-width:0}
.hero .split b{display:block;font-family:var(--font-display);font-weight:500;font-size:15px}
.hero .split small{font-size:11.5px;opacity:.8}
.hero .salary-btn{all:unset;cursor:pointer;border-radius:8px}
.hero .salary-btn:focus-visible{outline:2px solid var(--on-teal)}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:var(--r-sm);padding:12px 14px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12.5px;color:var(--muted)}
.stat .v{font-family:var(--font-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;font-weight:400;color:var(--muted);margin-inline-start:3px}
.stat .h{font-size:11.5px;color:var(--muted)}
.stat.wide{grid-column:1/-1}
.stat.debt{background:var(--warm-soft)}
.stat.debt .v{color:var(--warm)}
.stat.bad .v{color:var(--danger)}
.stat.good .v{color:var(--green)}
.ring{--p:0;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--teal-2) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring::after{content:"";width:32px;height:32px;border-radius:50%;background:var(--surface)}

/* alerts */
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px}
.alert.warn{background:var(--warn-soft)}
.alert.over{background:var(--danger-soft)}
.alert .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.alert.warn .dot{background:var(--warn)}
.alert.over .dot{background:var(--danger)}
.alert b{font-weight:600}

/* donut */
.donut-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:none;margin-inline:auto}
.donut text{fill:var(--ink);font-family:var(--font-display)}
.legend{flex:1 1 170px;min-width:0;display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:8px;font-size:13.5px}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .pc{color:var(--muted);font-size:12px;min-width:34px;text-align:left}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .ic{width:40px;height:40px;border-radius:12px;background:var(--teal-soft);display:grid;place-items:center;font-size:19px;flex:none}
.item .body{flex:1;min-width:0}
.item .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .amt{font-family:var(--font-display);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.del{border:0;background:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;font-size:12px;white-space:nowrap}
.del[data-armed]{background:var(--danger-soft);color:var(--danger);font-weight:600}
.link{border:0;background:none;color:var(--teal-2);cursor:pointer;font-weight:600;padding:6px 0;font-size:13.5px}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-size:13.5px}

/* budget */
.cat{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-inline:0;border-top:0;text-align:start;width:100%}
.cat:last-child{border-bottom:0}
.meter{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;border-radius:99px;background:var(--green)}
.meter i.warn{background:var(--warn)}
.meter i.over{background:var(--danger)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px}
.chip.ok{background:var(--teal-soft);color:var(--teal-2)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.over{background:var(--danger-soft);color:var(--danger)}
.chip.warm{background:var(--warm-soft);color:var(--warm)}
.chip.done{background:var(--surface-2);color:var(--muted)}

.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--teal);color:var(--on-teal);font-family:var(--font-display)}
.btn.ghost{background:var(--teal-soft);color:var(--teal-2)}
.btn.warmb{background:var(--warm);color:#fff}
.btn.dangerb{background:var(--danger-soft);color:var(--danger)}
.btn.full{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1}

/* segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:14px;padding:4px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;padding:9px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--teal-soft);color:var(--teal-2)}
.seg.warmseg button[aria-pressed="true"]{background:var(--warm-soft);color:var(--warm)}

.debt-ic{background:var(--warm-soft)!important;color:var(--warm)}
.pay-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--warm);white-space:nowrap}
.check{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}
.check svg{width:18px;height:18px;stroke:var(--surface);fill:none;stroke-width:2.4}
.check[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.check[aria-pressed="true"] svg{stroke:#fff}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
.dots i{width:12px;height:6px;border-radius:3px;background:var(--line)}
.dots i.paid{background:var(--teal-2)}
.dots i.turn{background:var(--warm)}
.dots i.now{outline:1.5px solid var(--ink);outline-offset:1px}
.debt-row{border-bottom:1px solid var(--line)}
.debt-row:last-child{border-bottom:0}
.debt-row .item{border-bottom:0}
.plan{display:flex;flex-direction:column;gap:8px;padding:0 0 12px}
.plan .meter i{background:var(--warm)}
.inst-btn{align-self:flex-start;border:1.5px solid var(--warm);background:var(--surface);color:var(--warm);border-radius:10px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer}
.inst-btn[aria-pressed="true"]{background:var(--warm);color:#fff}
.payoff{background:var(--warm-soft)}
.payoff h3{margin-bottom:4px}
.big-when{font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--warm)}
.when-list{margin:6px 0 0;padding-inline-start:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.cat:has(+ .subs){border-bottom:0}
.subs{display:flex;flex-direction:column;gap:8px;padding:0 0 12px;padding-inline-start:52px;border-bottom:1px solid var(--line)}
.subs:last-child{border-bottom:0}
.sub{display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.sub-n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter.thin{height:5px}
.sub-list{display:flex;flex-direction:column;gap:8px}
.sub-edit{display:grid;grid-template-columns:1fr 110px auto;gap:6px;align-items:center}
.sub-edit .input{padding:9px 10px}
.input:disabled{opacity:.6}

/* buttons that look like cards */
button.stat,button.card{border:0;font:inherit;color:inherit;text-align:start;cursor:pointer;width:100%}
button.stat{display:flex;flex-direction:column;gap:2px}
.link.inline{padding:0;font-size:inherit;display:inline}
/* wallet */
.wallet{display:flex;flex-direction:column;gap:10px}
.wallet .k{font-size:12.5px;color:var(--muted)}
.wal-big{font-family:var(--font-display);font-size:30px;font-weight:600;line-height:1.15}
.wal-big small{font-size:13px;font-weight:400;color:var(--muted)}
.wal-actions{display:flex;gap:6px;align-items:center}
.small-btn{padding:9px 14px;font-size:13.5px;border-radius:12px}
.wal-split{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px}
.wal-split div{min-width:0;display:flex;flex-direction:column}
.wal-split small{font-size:11.5px;color:var(--muted)}
.wal-split b{font-family:var(--font-display);font-weight:600;font-size:15px}
.spark{width:100%;height:auto;display:block;direction:ltr}
.spark text{font-family:var(--font-body)}
.fc{margin:0;font-size:14px;padding:10px 12px;border-radius:var(--r-sm)}
.fc.ok{background:var(--teal-soft)}
.fc.bad{background:var(--danger-soft);color:var(--ink)}
.fc-tip{margin:0;font-size:13.5px}
.upc summary{font-size:13px}
.upc ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.upc li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;font-size:13.5px}
.upc .pos{color:var(--green)}
.late{color:var(--danger);font-size:11.5px}
/* where did the money go */
.where{display:flex;flex-direction:column;gap:10px}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface-2);gap:2px}
.stack i{display:block;height:100%}
.where-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.where-list li{display:grid;grid-template-columns:auto 1fr auto 40px;gap:8px;align-items:center;font-size:13.5px}
.where-list .sw{width:10px;height:10px;border-radius:3px}
.where-list .pc{color:var(--muted);font-size:12px;text-align:left}
/* goal */
.goal{display:flex;flex-direction:column;gap:8px}
/* compare */
.bars{width:100%;height:auto;display:block;direction:ltr}
.bars text{font-family:var(--font-display)}
.deltas{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.deltas li{display:flex;justify-content:space-between}
.deltas .up{color:var(--danger)}
.deltas .down{color:var(--green)}
/* rows */
.item-btn{width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:start;font:inherit;color:inherit;cursor:pointer}
.item-btn:last-child{border-bottom:0}
.inc-ic{background:color-mix(in srgb,var(--green) 18%,transparent)!important}
.unk-ic{background:var(--danger-soft)!important}
.inc-amt{color:var(--green)}
.detail{background:var(--surface-2);border-radius:var(--r-sm);padding:14px;display:flex;flex-direction:column;gap:4px}
.d-amt{font-size:30px;font-weight:600}
.d-amt small{font-size:14px;font-weight:400;color:var(--muted)}
.d-meta{color:var(--muted);font-size:13.5px}
.d-note{font-size:14.5px}
.scroll-x{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll-x .pick{flex:none}
/* recon */
.recon-top{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.recon-top>div{display:flex;flex-direction:column;gap:4px}
.recon-top small{color:var(--muted);font-size:12.5px}
.recon-top b{font-family:var(--font-display);font-size:26px;font-weight:600;padding:8px 0}
.rc-gap{border-radius:var(--r-sm);padding:12px;font-size:15px;text-align:center}
.rc-gap.ok{background:var(--teal-soft)}
.rc-gap.bad{background:var(--danger-soft)}
.rc-gap.plus{background:var(--warn-soft)}
.day-chip{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:2px 8px;font-size:12px;cursor:pointer;margin:2px 0}
.rc-add{display:flex;flex-direction:column;gap:8px;margin-top:10px;padding:12px;border:1.5px dashed var(--line);border-radius:var(--r-sm)}
select.input{appearance:auto}
/* settings */
.set-group{display:flex;flex-direction:column;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.set-group:last-of-type{border-bottom:0}
.set-group h4{margin:0;font-family:var(--font-display);font-size:13px;color:var(--muted);font-weight:500}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;background:var(--surface-2);border-radius:12px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer;text-align:start}
.set-row b{font-family:var(--font-display);font-weight:500;color:var(--muted);font-size:13.5px}
.file-btn{position:relative;overflow:hidden;text-align:center}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.toggle small{font-size:12px}
.gap-hint{display:flex;flex-direction:column;gap:8px;background:var(--danger-soft);border-radius:var(--r-sm);padding:12px 14px;font-size:13.5px}
.gap-hint p{margin:0}
.gap-hint .btn{align-self:flex-start}
.flow{display:flex;flex-direction:column;background:var(--surface-2);border-radius:var(--r-sm);padding:4px 12px}
.flow-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.flow-row:last-child{border-bottom:0}
.flow-row>span{flex:1;min-width:0}
.flow-row b{font-family:var(--font-display);font-weight:500;color:var(--green);white-space:nowrap}
.flow-row.out b{color:var(--ink)}
.flow-row.total{font-weight:600}
.flow-row.total b{font-size:18px;color:var(--ink);font-weight:600}
.flow-row.chk input[type=checkbox]{width:20px;height:20px;accent-color:var(--teal);flex:none}
.input.mini{width:130px;flex:none;padding:7px 10px;font-size:14px}
.carry-lbl{font-size:12.5px;opacity:.9;margin-top:-6px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;padding:4px 0}

/* fab + nav */
.fab{position:fixed;inset-inline-start:max(16px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:18px;background:var(--teal);color:var(--on-teal);padding:13px 18px;display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgb(31 111 107 / .35)}
.fab svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
@media (min-width:600px){.fab{inset-inline-start:calc(50% - 264px)}}
.nav{position:fixed;inset-inline:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:500}
.nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"]{color:var(--teal-2)}
.nav a[aria-current="page"] svg{stroke-width:2.2}

/* sheet */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92vh;border-radius:24px 24px 0 0;background:var(--surface);color:var(--ink)}
dialog.sheet::backdrop{background:rgb(8 20 18 / .45)}
@media (prefers-reduced-motion:no-preference){dialog.sheet[open]{animation:up .22s ease-out}}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
.sheet form{display:flex;flex-direction:column;gap:14px;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 2px}
.sheet h2{font-size:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;color:var(--muted);font-weight:500}
.input{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:11px 12px;outline:none}
.input:focus{border-color:var(--teal-2)}
.input.amount{font-family:var(--font-display);font-size:28px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.pick{border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:7px 11px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:13.5px}
.pick[aria-pressed="true"]{border-color:var(--teal-2);background:var(--teal-soft);color:var(--teal-2);font-weight:600}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emojis .pick{justify-content:center;padding:6px 0;font-size:20px}
.err{color:var(--danger);font-size:12.5px;margin:-6px 0 0}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px}
.toggle input{width:44px;height:26px;accent-color:var(--teal)}
textarea.input{min-height:90px;font-size:12px;direction:ltr}
.toast{position:fixed;inset-inline:0;bottom:calc(140px + env(safe-area-inset-bottom,0px));margin:0 auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:13.5px;z-index:20}
</style>
<!--REPO-ONLY-START-->
<style>.app{padding-top:env(safe-area-inset-top,0px)}</style>
<!--REPO-ONLY-END-->
</head>
<body>
<div class="app" dir="rtl" lang="ar">
  <header class="top">
    <button class="icon-btn" id="prevM" aria-label="الشهر اللي فات"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <h1 id="title">ميزان<small id="monthLbl"></small></h1>
    <button class="icon-btn" id="nextM" aria-label="الشهر الجاي"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    <button class="icon-btn" id="settingsBtn" aria-label="الإعدادات"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>

  <main>
    <section class="screen" id="s-home"></section>
    <section class="screen" id="s-budget" hidden></section>
    <section class="screen" id="s-debts" hidden></section>
    <section class="screen" id="s-commit" hidden></section>
  </main>

  <button class="fab" id="fab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>سجّل مصروف</button>

  <nav class="nav" aria-label="الشاشات">
    <div class="nav-in">
      <a href="#home" data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>الرئيسية</a>
      <a href="#budget" data-tab="budget"><svg viewBox="0 0 24 24"><path d="M21 12A9 9 0 1 1 12 3v9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>الميزانية</a>
      <a href="#debts" data-tab="debts"><svg viewBox="0 0 24 24"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>الديون</a>
      <a href="#commit" data-tab="commit"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="M8 15h3"/></svg>الالتزامات</a>
    </div>
  </nav>
</div>

<dialog class="sheet" id="sheet" dir="rtl" lang="ar"></dialog>

<script src="app.js"></script>
</body>
</html>
